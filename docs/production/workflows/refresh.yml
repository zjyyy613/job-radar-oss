name: Refresh Job Radar

# PRODUCTION PIPELINE REFERENCE — NOT ACTIVE IN THIS REPOSITORY.
# The scheduled trigger was removed for the open-source release: this workflow
# writes to a live database and would require owner-held secrets that do not
# exist in a fork. It is kept so the production pipeline is documented and
# reviewable. Do not add a `schedule:` trigger here.
on:
  workflow_dispatch:
    inputs:
      sources:
        description: Existing job-pro allowlist only
        type: string
        default: alibaba,meituan,jd,netease,kuaishou,oppo,liauto,antgroup
      max_jobs:
        description: Per-source job cap (1–500); the window is page_size × max_pages
        type: number
        default: 2
      max_pages:
        description: Per-source page cap (1–20)
        type: number
        default: 1
      page_size:
        description: Records per page (1–50); max_jobs must be a multiple of it to be reached
        type: number
        default: 2
      start_page:
        description: First page to fetch (1–20); start_page + max_pages − 1 must stay ≤ 20
        type: number
        default: 1
      global_cap:
        description: Global list cap (1–500)
        type: number
        default: 16
      model_cap:
        description: Model HTTP attempts including retries (0–200)
        type: number
        default: 8
      resume_run_id:
        description: Previous run ID to restore; leave empty for a fresh incremental run
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: job-radar-production-writer
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore explicit checkpoint
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: refresh-checkpoint
          path: .verification/refresh
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Incremental refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-flash
          REFRESH_SOURCES: ${{ inputs.sources || 'alibaba,meituan,jd,netease,kuaishou,oppo,liauto,antgroup' }}
          REFRESH_MAX_JOBS: ${{ inputs.max_jobs || '2' }}
          REFRESH_MAX_PAGES: ${{ inputs.max_pages || '1' }}
          # A scheduled run has no inputs, so this always falls back to the daily
          # page size of 2. page_size=0 is invalid downstream, hence `||`.
          REFRESH_PAGE_SIZE: ${{ inputs.page_size || '2' }}
          # Scheduled runs have no inputs, so the window always starts at page 1.
          REFRESH_START_PAGE: ${{ inputs.start_page || '1' }}
          REFRESH_GLOBAL_MAX_JOBS: ${{ inputs.global_cap || '16' }}
          REFRESH_MODEL_CAP: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.model_cap) || '8' }}
        run: node --import tsx scripts/ingest/run-refresh.ts
      # Reporting only: summarises the summary.json the run already produced and
      # surfaces PARTIAL explicitly. It cannot change the run's own verdict.
      - name: Audit the refresh result
        if: always()
        continue-on-error: true
        run: |
          node --import tsx scripts/ingest/refresh-audit.ts \
            --summary .verification/refresh/summary.json \
            --out .verification/refresh
      - name: Publish refresh audit to the run summary
        if: always()
        run: |
          if [ -f .verification/refresh/refresh-audit.md ]; then
            cat .verification/refresh/refresh-audit.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve recovery checkpoint and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-checkpoint
          path: |
            .verification/refresh/checkpoint.json
            .verification/refresh/summary.json
            .verification/refresh/refresh-audit.md
            .verification/refresh/refresh-audit.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: warn
